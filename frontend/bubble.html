<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOx</title>
<link rel="icon" href="/static/assets/icon-64.png">
<link rel="stylesheet" href="/static/shared.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-grad), var(--bg);
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding: 6px; box-sizing: border-box; }
  .speech { box-shadow: var(--shadow); min-height: 44px; max-height: 70px; width: 100%; box-sizing: border-box; overflow: hidden;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 7px 10px; font-size: 12px; line-height: 1.3; opacity: 0; transition: opacity .25s; margin-bottom: 4px; }
  .speech.on { opacity: 1; }
  .m { width: 120px; height: 112px; cursor: pointer; filter: drop-shadow(0 0 16px var(--glow)); }
  .ctrl { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
  .wrap:hover .ctrl { opacity: 1; }
  .ctrl button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
  .ctrl button:hover { background: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl">
    <button id="bOpen" onclick="openFull()">⤢</button>
    <button id="bQuit" onclick="quitDox()">×</button>
  </div>
  <div id="speech" class="speech"></div>
  <div id="m" class="m" onclick="openFull()"><img id="logo" class="logo" data-mood="idle" alt="DOx" draggable="false"></div>
</div>

<script src="/static/shared.js"></script>
<script>
  let sleepTimer, speechTimer;
  const $logo = document.getElementById("logo"), $s = document.getElementById("speech");

  function refresh() {
    $logo.src = DoxSettings.logoSrc();
    document.getElementById("m").title = DoxSettings.t("bubble.tip");
    document.getElementById("bOpen").title = DoxSettings.t("bubble.open");
    document.getElementById("bQuit").title = DoxSettings.t("bubble.quit");
  }
  function setMood(x) {
    $logo.dataset.mood = x;
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(() => setMood("sleepy"), 90000);
  }
  function say(text, ms) {
    $s.textContent = text.length > 110 ? text.slice(0, 107) + "…" : text;
    $s.classList.add("on");
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => $s.classList.remove("on"), ms || 7000);
  }
  function api(name) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api[name]) window.pywebview.api[name]();
  }
  function openFull() { api("open_full"); }
  function quitDox() { api("quit"); }

  // Llamadas desde desktop.py
  window.doxIncoming = (p) => { setMood(p.mood || "idle"); say(p.reply); };
  window.doxListening = () => { setMood("surprised"); say(DoxSettings.t("listening"), 6000); };

  // La ventana principal puede cambiar tema o idioma: la burbuja se entera revisando cada 4 s (es un JSON diminuto, local)
  window.addEventListener("doxsettings", refresh);
  DoxSettings.load();
  setInterval(() => { if (!document.hidden) DoxSettings.load(); }, 4000);
  setMood("idle");
</script>
</body>
</html>
